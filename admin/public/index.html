<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin blog — conform-IT (local)</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Admin blog conform-IT <span class="badge">local</span></h1>
      <div class="topbar-actions">
        <button id="btn-build-dist" class="btn btn-ghost-dark">Aperçu (dist/)</button>
        <button id="btn-build-prod" class="btn btn-primary">🔨 Générer le site (prod/)</button>
        <button id="btn-new" class="btn btn-primary">+ Nouvel article</button>
      </div>
    </header>

    <div id="build-status" class="build-status hidden"></div>

    <main>
      <section id="view-list">
        <div class="toolbar">
          <input id="filter-search" type="search" placeholder="Rechercher un titre..." />
          <select id="filter-category">
            <option value="">Toutes les catégories</option>
          </select>
          <span id="count" class="count"></span>
        </div>
        <p class="hint">Glissez une ligne (⠿) pour changer l'ordre d'affichage. L'ordre manuel passe avant les articles triés par date.</p>
        <table id="article-table">
          <thead>
            <tr>
              <th></th>
              <th></th>
              <th>Titre</th>
              <th>Catégorie</th>
              <th>Date</th>
              <th>Statut</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="article-rows"></tbody>
        </table>
      </section>

      <section id="view-form" class="hidden">
        <div class="form-header">
          <button id="btn-back" class="btn btn-ghost">← Retour à la liste</button>
          <h2 id="form-title">Nouvel article</h2>
        </div>

        <form id="article-form">
          <input type="hidden" id="f-slug" />

          <label>
            Titre <span class="required">*</span>
            <input id="f-title" type="text" required />
          </label>
          <p id="f-slug-preview" class="hint"></p>

          <label>
            Titre SEO (optionnel)
            <input id="f-seo-title" type="text" placeholder="Vide = le titre ci-dessus. « - conform-IT » est ajouté automatiquement." />
            <span id="f-seo-title-count" class="counter"></span>
          </label>

          <label>
            Description — résumé (extrait affiché sur la liste, et meta description par défaut)
            <textarea id="f-description" rows="2"></textarea>
            <span id="f-description-count" class="counter"></span>
          </label>

          <label>
            Meta description (optionnelle)
            <textarea id="f-meta-description" rows="2" placeholder="Vide = le résumé ci-dessus sert de meta description."></textarea>
            <span id="f-meta-description-count" class="counter"></span>
          </label>

          <div class="grid-2">
            <label>
              Catégorie / groupe
              <select id="f-category-select">
                <option value="">— Aucune —</option>
                <option value="__new__">+ Nouvelle catégorie…</option>
              </select>
              <input id="f-category-new" type="text" placeholder="Nom de la nouvelle catégorie" class="hidden" />
              <input type="hidden" id="f-category" />
            </label>

            <label>
              Date de publication
              <input id="f-pubdate" type="date" />
            </label>
          </div>

          <div class="grid-2">
            <label>
              Ordre manuel (optionnel)
              <input id="f-order" type="number" placeholder="Laisser vide = trié par date" />
            </label>

            <div class="checks">
              <label class="check"><input id="f-featured" type="checkbox" /> Mis en avant (featured)</label>
              <label class="check"><input id="f-hidden" type="checkbox" /> Masqué (hidden — retiré des listes du site)</label>
              <label class="check"><input id="f-noindex" type="checkbox" /> noindex (exclu de Google et du sitemap)</label>
            </div>
          </div>

          <label>
            Image
            <input id="f-image-file" type="file" accept="image/*" />
            <input type="hidden" id="f-image" />
          </label>
          <div id="image-preview" class="image-preview hidden">
            <img id="image-preview-img" alt="" />
          </div>
          <label>
            Texte alternatif de l'image
            <input id="f-image-alt" type="text" placeholder="Décrit l'image pour l'accessibilité" />
          </label>

          <label>
            Contenu (Markdown)
            <textarea id="f-body" rows="18" class="mono"></textarea>
          </label>

          <div class="form-actions">
            <button type="button" id="btn-delete" class="btn btn-danger hidden">Supprimer l'article</button>
            <div class="spacer"></div>
            <span id="form-error" class="error"></span>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
          </div>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
